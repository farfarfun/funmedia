[project]
name = "funmedia"
version = "1.2.12"
description = "抖音/TikTok/微博/Twitter 多媒体数据采集与下载工具"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [ "aiofiles>=24.1.0", "aiosqlite>=0.20.0", "emoji>=2.14.0", "gmssl>=3.2.2", "httpx>=0.27.2", "lxml>=6.1.0", "openpyxl>=3.1.5", "qrcode>=8.0", "rich>=13.9.4", "browser-cookie3>=0.19.1", "click>=8.1.7", "importlib-resources>=6.4.0", "jsonpath-ng>=1.6.1", "m3u8>=6.0.0", "protobuf>=4.25.0", "pydantic>=2.9.0", "PyExecJS>=1.5.1", "pyyaml>=6.0.2", "websockets>=13.1", "farlog>=1.1.8",]
license-files = ["LICENSE"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/funmedia"]

[dependency-groups]
dev = [ "pytest>=8.3.0", "pytest-asyncio>=0.24.0",]
